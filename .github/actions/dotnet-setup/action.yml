name: ".NET Setup"
description: "Install .NET SDK from global.json, configure NuGet caching, and restore dependencies"

inputs:
  global-json-file:
    description: "Path to global.json for SDK version pinning"
    required: false
    default: "./src/global.json"
  solution-path:
    description: "Path to .slnx or .sln file (relative to working-directory)"
    required: false
    default: "*.slnx"
  working-directory:
    description: "Working directory for restore (should contain global.json)"
    required: false
    default: "./src"
  cache-dependency-path:
    description: "Glob pattern for NuGet cache key"
    required: false
    default: "**/packages.lock.json"
  locked-mode:
    description: "Use --locked-mode for restore (fails if packages.lock.json is outdated)"
    required: false
    default: "false"
  cache-enabled:
    description: "Enable NuGet dependency caching"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: ${{ inputs.global-json-file }}
        cache: ${{ inputs.cache-enabled == 'true' }}
        cache-dependency-path: ${{ inputs.cache-enabled == 'true' && inputs.cache-dependency-path || '' }}

    - name: Restore dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: dotnet restore ${{ inputs.locked-mode == 'true' && '--locked-mode' || '' }} ${{ inputs.solution-path }}
