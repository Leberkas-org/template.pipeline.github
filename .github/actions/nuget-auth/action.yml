name: "NuGet Auth"
description: "Configure authenticated NuGet source for private feeds"

inputs:
  source-url:
    description: "NuGet feed URL"
    required: true
  source-name:
    description: "Name for the NuGet source"
    required: false
    default: "private-feed"
  api-key:
    description: "Authentication token for the feed"
    required: true

runs:
  using: "composite"
  steps:
    - name: Add authenticated NuGet source
      shell: bash
      run: >
        dotnet nuget add source
        "${{ inputs.source-url }}"
        --name "${{ inputs.source-name }}"
        --username "az"
        --password "${{ inputs.api-key }}"
        --store-password-in-clear-text
