name: NuGet Publish

on:
  workflow_call:
    inputs:
      dotnet-version-file:
        description: "Path to global.json for SDK version"
        required: false
        type: string
        default: "./src/global.json"
      solution-path:
        description: "Path to .slnx or .sln file"
        required: true
        type: string
      version:
        description: "SemVer version string (from release-please)"
        required: true
        type: string
      tag-name:
        description: "Git tag name for release attachment"
        required: true
        type: string
      package-output-directory:
        description: "Output directory for .nupkg files"
        required: false
        type: string
        default: "./packages"
      nuget-source:
        description: "NuGet feed URL"
        required: false
        type: string
        default: "https://api.nuget.org/v3/index.json"
    secrets:
      nuget-api-key:
        description: "NuGet.org API key"
        required: true

permissions:
  contents: write

jobs:
  nuget-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: Leberkas-org/template.pipeline.github/.github/actions/dotnet-setup@main
        with:
          global-json-file: ${{ inputs.dotnet-version-file }}
          solution-path: ${{ inputs.solution-path }}

      - name: Build
        run: >
          dotnet build
          --configuration Release
          --no-restore
          ${{ inputs.solution-path }}
          /p:Version=${{ inputs.version }}
          /p:ContinuousIntegrationBuild=true

      - name: Create NuGet package
        run: >
          dotnet pack
          --configuration Release
          --no-build
          --output ${{ inputs.package-output-directory }}
          ${{ inputs.solution-path }}
          /p:PackageVersion=${{ inputs.version }}

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ${{ inputs.package-output-directory }}/*.nupkg

  nuget-publish:
    runs-on: ubuntu-latest
    needs: nuget-build
    environment: nuget
    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ${{ inputs.package-output-directory }}

      - name: Install .NET
        uses: actions/setup-dotnet@v5

      - name: Push to NuGet
        run: >
          dotnet nuget push
          ${{ inputs.package-output-directory }}/*.nupkg
          --source ${{ inputs.nuget-source }}
          --api-key ${{ secrets.nuget-api-key }}
          --skip-duplicate

      - name: Attach packages to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag-name }}
          files: ${{ inputs.package-output-directory }}/*.nupkg
